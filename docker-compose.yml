x-agent: &agent
  build: .
  env_file: .env
  environment:
    HOST: 0.0.0.0
    FLIGHTS_URL: http://flights:8001
    HOTELS_URL: http://hotels:8002
    ACTIVITIES_URL: http://activities:8003

x-health: &health
  interval: 10s
  timeout: 3s
  retries: 6

services:
  flights:
    <<: *agent
    command: python -m mesh.agents.flights
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
  hotels:
    <<: *agent
    command: python -m mesh.agents.hotels
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')"]
  activities:
    <<: *agent
    command: python -m mesh.agents.activities
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/healthz')"]
  orchestrator:
    <<: *agent
    ports: ["8000:8000"]
    command: ["adk", "web", "--host", "0.0.0.0", "--port", "8000",
              "--session_service_uri", "sqlite+aiosqlite:////data/sessions.db", "mesh"]
    volumes: ["sessions:/data"]
    depends_on:
      flights: {condition: service_healthy}
      hotels: {condition: service_healthy}
      activities: {condition: service_healthy}

volumes:
  sessions: {}
