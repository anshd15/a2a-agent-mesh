[project]
name = "a2a-agent-mesh"
version = "0.10.0"
description = "Google ADK orchestrator delegating to LangGraph/CrewAI/ADK agents over A2A"
requires-python = ">=3.11"
dependencies = [
  "google-adk[a2a,db]>=2.0",
  "a2a-sdk>=1.0",
  "langgraph>=0.6",
  "langchain-google-genai>=2.1",
  "crewai>=0.150",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "opentelemetry-sdk>=1.25",
  "prometheus-client>=0.20",
]

[project.scripts]
mesh-demo = "mesh.demo:main"
mesh-agents = "mesh.launcher:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27",
       "mypy>=1.10"]
tracing = ["opentelemetry-exporter-otlp-proto-http>=1.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mesh"]

[tool.ruff]
line-length = 100

[tool.coverage.run]
source = ["mesh"]
branch = true

[tool.coverage.report]
# Currently ~97% with branch coverage; the gate leaves headroom without letting it slide.
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
packages = ["mesh"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# LangChain / CrewAI / A2A ship partial or no type stubs.
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
