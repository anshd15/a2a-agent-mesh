[project]
name = "a2a-agent-mesh"
version = "0.3.0"
description = "Google ADK orchestrator delegating to LangGraph/CrewAI/ADK agents over A2A"
requires-python = ">=3.11"
dependencies = [
  "google-adk[a2a]>=2.0",
  "a2a-sdk>=1.0",
  "langgraph>=0.6",
  "langchain-google-genai>=2.1",
  "crewai>=0.150",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "httpx>=0.27"]
tracing = ["opentelemetry-exporter-otlp-proto-http>=1.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mesh"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
